version: "3.9"

services:
  backend:
    build: .
    container_name: vanna-back
    command: flask run --host=0.0.0.0 --port=5000
    environment:
      - FLASK_APP=backend/app.py
      - FLASK_RUN_HOST=0.0.0.0
      - FLASK_RUN_PORT=5000
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]  # ajustá a /api/ping si existe
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: .
    container_name: vanna-front
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - .env
    ports:
      - "8501:8501"

    depends_on:
      backend:
        condition: service_healthy
