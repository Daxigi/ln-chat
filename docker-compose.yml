services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vanna-backend
    env_file: .env
    environment:
      API_PORT: ${API_PORT:-8000}
      VANNA_VECTOR_DB_PATH: /data/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma
      - ./vps_backups:/app/backend/backups
    networks: [vanna_net]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: vanna-frontend
    env_file: .env
    environment:
      # --- CAMBIO IMPORTANTE AQUÍ ---
      STREAMLIT_API_BASE_URL: ${STREAMLIT_API_BASE_URL:-http://backend:8000}
      STREAMLIT_SERVER_PORT: ${STREAMLIT_SERVER_PORT:-8501}
      STREAMLIT_SERVER_HEADLESS: ${STREAMLIT_SERVER_HEADLESS:-true}
    ports:
      - "8501:8501"
    depends_on: [backend]
    networks: [vanna_net]
    restart: unless-stopped

volumes:
  chroma_data: {}

networks:
  vanna_net: {}