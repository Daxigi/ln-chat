services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vanna-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8000}
      VANNA_VECTOR_DB_PATH: /data/chroma
    volumes:
      - chroma_data:/data/chroma
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vanna-frontend
    ports:
      - "8501:8501"
    env_file: .env
    environment:
      STREAMLIT_SERVER_PORT: ${STREAMLIT_SERVER_PORT:-8501}
      STREAMLIT_SERVER_HEADLESS: ${STREAMLIT_SERVER_HEADLESS:-true}
      STREAMLIT_API_BASE_URL: ${STREAMLIT_API_BASE_URL:-http://backend:${API_PORT:-8000}}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data: {}

