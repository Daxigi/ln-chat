services:
  backend:
    build: ./backend
    container_name: vanna-backend
    ports:
      - "8000:8000"
    env_file:
      .env
    networks:
      - vanna_net

  frontend:
    build: ./frontend
    container_name: vanna-frontend
    ports:
      - "8501:8501"
    env_file:
      .env
    depends_on:
      - backend
    networks:
      - vanna_net

networks:
  vanna_net: {}
