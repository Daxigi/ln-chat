version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vanna-backend
    ports:
      - "8000:8000"
    env_file: .env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vanna-frontend
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - backend
    restart: unless-stopped
